<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sintija Kirsone</title>
  <meta name="description" content="Sintija Kirsone — multidisciplinary artist based in Riga, Latvia. Installations, screen print, video.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Inria+Sans:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script>try{document.documentElement.setAttribute("data-bg",localStorage.getItem("sk-bg")||"grey")}catch(e){document.documentElement.setAttribute("data-bg","grey")}</script>
</head>
<body>
  <div class="ice-layer" id="ice-layer" aria-hidden="true"></div>

  <nav class="works-panel" id="works-panel" aria-label="Works"></nav>
  <div class="pile" id="pile"></div>

  <main>
    <section class="view all-page" id="view-all" aria-label="All works"></section>

    <section class="view about-page" id="view-about">
      <div class="about-text">
        <h1 data-ui="about">About me</h1>
        <p></p>
      </div>
      <div class="portrait" id="portrait"><img alt="Sintija Kirsone"></div>
    </section>

    <section class="view contact-page" id="view-contact" aria-label="Contact"></section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/ice.js"></script>
  <script src="js/common.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
